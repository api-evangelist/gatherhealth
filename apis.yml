aid: gatherhealth
name: Gatherhealth
description: >-
  Gather Health is a Boston-area primary care organization delivering
  team-based, community-centered medical care for seniors aged 65+ on Medicare.
  Operating neighborhood locations across Quincy, Lynn, Dorchester, and
  Brockton, each patient is supported by a care team of a primary care provider,
  a "Gather Guide," and a medical technician, with both in-office and home-based
  visits, care coordination with specialists and hospitals, and 24/7 urgent care
  support. Gather Health is a portfolio company of Khosla Ventures. As a
  care-delivery organization it does not publish a public developer API or
  developer portal; it uses athenahealth for its patient portal. This profile is
  maintained in the API Evangelist network as a company identity record.
